<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spiral Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f0c29;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(25px);
      border-radius: 22px;
      padding: 45px 35px;
      text-align: center;
      color: #fff;
      width: 440px;
      box-shadow: 0 0 35px rgba(0,0,0,0.6);
      animation: floatCard 5s ease-in-out infinite alternate;
      border: 2px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, #ff0080, #00ffe7, #ff9f1c, #7928ca);
      background-size: 400% 400%;
      animation: borderShift 6s ease infinite;
      filter: blur(14px);
      opacity: 0.35;
      border-radius: 25px;
      z-index: 0;
    }

    @keyframes borderShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    @keyframes floatCard {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-10px) scale(1.03); }
    }

    h2 {
      font-size: 28px;
      color: #ffd166;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .subtitle {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    .file-input {
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    input[type="file"] {
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #ffd166;
      color: #fff;
      border-radius: 12px;
      width: 100%;
    }

    input[type="file"]::file-selector-button {
      background: #ffd166;
      border: none;
      color: #333;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 10px;
      font-weight: 600;
    }

    .preview {
      margin-top: 15px;
      display: none;
      position: relative;
      z-index: 2;
    }

    .preview img {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid #ffd166;
    }

    .btn {
      padding: 14px 34px;
      border: none;
      border-radius: 30px;
      background: #ffd166;
      color: #333;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 15px;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }

    .btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .btn:hover:not(:disabled) {
      background: #ff9f1c;
      transform: scale(1.05);
    }

    .loading {
      display: none;
      margin-top: 15px;
      font-size: 14px;
      color: #ffd166;
      position: relative;
      z-index: 2;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #ffd166;
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>

<!-- Back Button -->
<a href="{% url 'home' %}" style="
  position:absolute; top:20px; left:20px; z-index:999;
  background:#FFD166; padding:10px 20px; border-radius:30px;
  color:black; text-decoration:none; font-weight:600;">
  ⬅ Back to Home
</a>

<canvas id="vortex"></canvas>

<div class="container">
  <div class="card">

    <h2>Upload Spiral Drawing</h2>
    <div class="subtitle">
      Upload a clear image of your spiral drawing for analysis
    </div>

    <form method="POST" enctype="multipart/form-data"
          action="{% url 'spiral_view' %}"
          onsubmit="startLoading()">
      {% csrf_token %}

      <div class="file-input">
        <input type="file" name="spiral_image"
               accept="image/png, image/jpeg"
               required onchange="previewImage(event)">
      </div>

      <div class="preview" id="preview">
        <img id="previewImg">
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Analyze Drawing
      </button>

      <div class="loading" id="loading">
        🔍 Analyzing your drawing, please wait...
      </div>
    </form>

    {% if result %}
      <div class="result">
        <strong>Prediction:</strong> {{ result }}
      </div>
    {% endif %}

  </div>
</div>

<script>
  function previewImage(event) {
    const preview = document.getElementById('preview');
    const img = document.getElementById('previewImg');
    img.src = URL.createObjectURL(event.target.files[0]);
    preview.style.display = 'block';
  }

  function startLoading() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('submitBtn').disabled = true;
  }

  // Background animation
  const canvas = document.getElementById("vortex");
  const ctx = canvas.getContext("2d");
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  let t = 0;

  function animate() {
    ctx.fillStyle = 'rgba(15,12,41,0.12)';
    ctx.fillRect(0,0,w,h);

    for (let i=0;i<180;i++) {
      const a = (i*360/180+t)*Math.PI/180;
      const r = 120+i*1.3;
      const x = w/2 + Math.cos(a)*r;
      const y = h/2 + Math.sin(a)*r;
      ctx.beginPath();
      ctx.arc(x,y,1.8,0,Math.PI*2);
      ctx.fillStyle = 'rgba(0,255,255,0.7)';
      ctx.fill();
    }
    t+=0.9;
    requestAnimationFrame(animate);
  }
  animate();

  window.onresize = () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
</script>

</body>
</html>
