<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brain Scan Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f0c29;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 50px 30px;
      text-align: center;
      color: #fff;
      width: 400px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.07);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #ff0080, #00ffe7, #ff9f1c, #7928ca);
      background-size: 400% 400%;
      animation: borderShift 6s ease infinite;
      filter: blur(12px);
      opacity: 0.3;
      border-radius: 25px;
      z-index: 0;
    }

    @keyframes borderShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .card h2 {
      font-size: 26px;
      color: #ffd166;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    .file-input {
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    input[type="file"] {
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #ffd166;
      color: #fff;
      border-radius: 12px;
      width: 100%;
    }

    input[type="file"]::file-selector-button {
      background: #ffd166;
      border: none;
      color: #333;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 12px;
    }

    input[type="file"]::file-selector-button:hover {
      background: #ff9f1c;
    }

    .btn {
      padding: 14px 34px;
      border: none;
      border-radius: 30px;
      background: #ffd166;
      color: #333;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      position: relative;
      z-index: 2;
    }

    .btn:hover {
      background: #ff9f1c;
      transform: scale(1.05);
    }

    .message-box {
      margin-bottom: 20px;
      background-color: rgba(255, 100, 100, 0.1);
      color: #ff7675;
      padding: 12px;
      border: 1px solid #ff7675;
      border-radius: 10px;
      font-size: 14px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

<!-- Back to Assessment Options Button -->
<!-- Back to Home Button -->
<a href="{% url 'home' %}" style="
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 999;
  background-color: #FFD166;
  padding: 10px 20px;
  border-radius: 30px;
  color: black;
  text-decoration: none;
  font-weight: 600;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
  transition: all 0.3s ease;
" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
  ⬅ Back to Home
</a>

<canvas id="vortex"></canvas>

<div class="container">
  <div class="card">
    <h2>Upload Brain Scan</h2>

    <!-- 🔥 Added message display block here -->
    {% if messages %}
      {% for message in messages %}
        <div class="message-box">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data" action="{% url 'brain_upload' %}">
      {% csrf_token %}
      <div class="file-input">
        <input type="file" name="brain_image" accept="image/png, image/jpeg" required>
      </div>
      <button type="submit" class="btn">Analyze</button>
    </form>
  </div>
</div>

<script>
  const canvas = document.getElementById("vortex");
  const ctx = canvas.getContext("2d");

  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  const points = [];
  const numPoints = 80;

  for (let i = 0; i < numPoints; i++) {
    points.push({
      x: (i / numPoints) * w,
      y: h / 2,
      vy: Math.random() * 2 - 1
    });
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    for (let i = 0; i < points.length; i++) {
      points[i].y += points[i].vy;
      if (points[i].y < h / 2 - 80 || points[i].y > h / 2 + 80) {
        points[i].vy *= -1;
      }
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();

    const grd = ctx.createLinearGradient(0, 0, w, h);
    grd.addColorStop(0, "rgba(255, 0, 128, 0.1)");
    grd.addColorStop(0.5, "rgba(0, 255, 255, 0.1)");
    grd.addColorStop(1, "rgba(255, 255, 255, 0.05)");
    ctx.fillStyle = grd;
    ctx.fill();

    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener("resize", () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
