{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeuroSense – Voice Assessment Result</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f0c29;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      color: #fff;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(25px);
      border-radius: 22px;
      padding: 45px 35px;
      width: 520px;
      text-align: center;
      box-shadow: 0 0 35px rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, #00ffe7, #ff0080, #ffd166, #7928ca);
      background-size: 400% 400%;
      animation: borderShift 6s ease infinite;
      filter: blur(14px);
      opacity: 0.35;
      border-radius: 25px;
      z-index: 0;
    }

    @keyframes borderShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h2 {
      font-size: 30px;
      color: #ffd166;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .subtitle {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    .result-text {
      font-size: 24px;
      font-weight: 600;
      margin: 25px 0 15px;
      position: relative;
      z-index: 2;
    }

    .result-text.healthy { color: #6bff6b; }
    .result-text.parkinsons { color: #ff6b6b; }

    .confidence {
      font-size: 16px;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    .note {
      text-align: left;
      font-size: 14px;
      line-height: 1.8;
      background: rgba(255,255,255,0.08);
      padding: 14px;
      border-left: 4px solid #ffd166;
      border-radius: 8px;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }

    .map-container {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 15px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 30px;
      border-radius: 30px;
      border: none;
      background: #ffd166;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
      z-index: 2;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #ff9f1c;
      transform: scale(1.05);
    }

    .home-btn {
      position: absolute;
      top: 20px;
      left: 30px;
      background: #ffd166;
      color: #333;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      text-decoration: none;
      font-weight: 600;
      z-index: 3;
    }
  </style>
</head>

<body>

<a href="{% url 'assessment_options' %}" class="home-btn">
  ⬅ Back to Assessments
</a>

<canvas id="blob"></canvas>

<div class="container">
  <div class="card">

    <h2>Voice Assessment Result</h2>
    <div class="subtitle">Your voice sample has been analyzed</div>

    <div class="result-text" id="predictionResult"></div>
    <div class="confidence">
      Confidence: <span id="confidenceValue"></span>%
    </div>

    <!-- Dynamic info -->
    <div id="infoSection"></div>

    <a href="{% url 'voice_upload' %}" class="btn">
      Upload New Sample
    </a>

  </div>
</div>

<script>
  /* ===== BACKGROUND ANIMATION ===== */
  const canvas = document.getElementById("blob");
  const ctx = canvas.getContext("2d");
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  let t = 0;

  function animate() {
    ctx.clearRect(0,0,w,h);
    const g = ctx.createRadialGradient(w/2,h/2,120,w/2,h/2,600);
    g.addColorStop(0,'rgba(0,255,255,0.12)');
    g.addColorStop(0.5,'rgba(255,0,128,0.06)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
    t+=0.004;
    requestAnimationFrame(animate);
  }
  animate();

  window.onresize = () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  };

  /* ===== RESULT LOGIC ===== */
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const prediction = params.get("prediction") || "";
    const confidence = parseFloat(params.get("confidence"));

    const resultEl = document.getElementById("predictionResult");
    const confEl = document.getElementById("confidenceValue");
    const infoEl = document.getElementById("infoSection");

    confEl.textContent = isNaN(confidence) ? "N/A" : confidence.toFixed(1);

    const lower = prediction.toLowerCase();

    if (lower.includes("parkinson")) {
      resultEl.textContent = "Parkinson’s Indication Detected";
      resultEl.classList.add("parkinsons");

      infoEl.innerHTML = `
        <div class="note">
          Your voice analysis shows patterns that may be associated with
          Parkinson’s-related changes.
          <br><br>
          <strong>This is only a screening result.</strong>
          It does not confirm a medical diagnosis.
          <br><br>
          We strongly recommend consulting a
          <strong>qualified neurologist</strong>.
        </div>

        <div class="map-container">
          <iframe
            src="https://www.google.com/maps?q=neurologist+near+me&output=embed"
            loading="lazy">
          </iframe>
        </div>
      `;
    } else {
      resultEl.textContent = "Healthy Voice Detected";
      resultEl.classList.add("healthy");

      infoEl.innerHTML = `
        <div class="note">
          Your voice characteristics appear to be within the normal range.
          <br><br>
          No Parkinson’s-related voice abnormalities were detected.
          Continue maintaining a healthy lifestyle and consult a doctor
          if you notice any changes in the future.
        </div>
      `;
    }
  });
</script>

</body>
</html>
