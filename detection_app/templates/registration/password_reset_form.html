{% extends 'detection_app/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Reset Password</h2>
    <p class="text-gray-600 mb-6">Enter your email address to receive a password reset link.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            {{ form.email.label_tag }}
            <input type="email" name="email" class="w-full mt-1 p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500" required id="id_email">
            {% if form.email.errors %}
                <p class="text-red-500 text-sm mt-1">{{ form.email.errors.0 }}</p>
            {% endif %}
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded hover:bg-blue-700 transition">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
